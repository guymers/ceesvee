name: Release
on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    runs-on: ubuntu-24.04
    name: Publish
    permissions:
      contents: read
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install JDK 21
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: zulu
          java-version: 21
          java-package: jdk
          cache: sbt

      - name: Install SBT
        uses: sbt/setup-sbt@7e114eae4f32ec3f93c851c2793376a77f384409 # v1.5.15

      - name: Release
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}

      - name: Attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            target/out/jvm/*/ceesvee-core/ceesvee-core_3-*.jar
            target/out/jvm/*/ceesvee-fs2/ceesvee-fs2_3-*.jar
            target/out/jvm/*/ceesvee-zio/ceesvee-zio_3-*.jar
            !target/out/jvm/**/*-sources.jar
            !target/out/jvm/**/*-javadoc.jar
